apiVersion: kafka.strimzi.io/v1
kind: KafkaConnector
metadata:
  name: asset-mysql
  labels:
    strimzi.io/cluster: debezium

spec:
  class: io.debezium.connector.mysql.MySqlConnector
  tasksMax: 1

  autoRestart:
    enabled: true

  config:
    database.hostname: 10.0.1.119
    database.port: 3306
    database.user: ${secrets:velony/asset-secret:CDCMYSQL_USERNAME}
    database.password: ${secrets:velony/asset-secret:CDCMYSQL_PASSWORD}

    database.server.id: 5411

    snapshot.mode: when_needed

    topic.prefix: asset

    database.include.list: velony_asset
    table.include.list: velony_asset.outbox_events

    schema.history.internal.kafka.bootstrap.servers: kafka-kafka-bootstrap:9092
    schema.history.internal.kafka.topic: debezium-schema-history-asset

    include.schema.changes: false

    snapshot.locking.mode: none

    transforms: outbox
    transforms.outbox.type: io.debezium.transforms.outbox.EventRouter
    transforms.outbox.route.by.field: aggregate_type
    transforms.outbox.route.topic.replacement: asset.${routedByValue}
    transforms.outbox.table.field.event.key: aggregate_id
    transforms.outbox.table.field.event.payload: payload
    transforms.outbox.table.expand.json.payload: true
    transforms.outbox.table.fields.additional.placement: type:header:type,tags:header:tags

    value.converter: org.apache.kafka.connect.json.JsonConverter
    value.converter.schemas.enable: false
