apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: debezium-secret-reader
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: debezium-secret-reader
subjects:
  - kind: ServiceAccount
    name: debezium-connect
roleRef:
  kind: Role
  name: debezium-secret-reader
  apiGroup: rbac.authorization.k8s.io
