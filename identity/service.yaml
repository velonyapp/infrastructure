apiVersion: v1
kind: Service

metadata:
  name: identity
  labels:
    app.kubernetes.io/name: identity
    app.kubernetes.io/part-of: velony

spec:
  type: ClusterIP

  selector:
    app.kubernetes.io/name: identity

  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: http

    - name: grpc
      port: 50051
      protocol: TCP
      targetPort: grpc
