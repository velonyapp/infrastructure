apiVersion: apps/v1
kind: Deployment

metadata:
  name: identity
  labels:
    app.kubernetes.io/name: identity
    app.kubernetes.io/part-of: velony

spec:
  replicas: 5

  selector:
    matchLabels:
      app.kubernetes.io/name: identity

  template:
    metadata:
      labels:
        app.kubernetes.io/name: identity
        app.kubernetes.io/part-of: velony

    spec:
      imagePullSecrets:
        - name: ghcr-pull

      containers:
        - name: identity
          image: ghcr.io/velonyapp/identity:sha-ca71d2a
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

            - name: grpc
              containerPort: 9000
              protocol: TCP

          livenessProbe:
            grpc:
              port: 9000
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2

          readinessProbe:
            grpc:
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 2

          envFrom:
            - secretRef:
                name: identity-secret
              prefix: VELONY_IDENTITY_

          volumeMounts:
            - name: config
              mountPath: /data/config
              readOnly: true

      volumes:
        - name: config
          configMap:
            name: identity-config
